[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "payanlint"
dynamic = ["version"]
description = "Lint a Persian Word thesis: half-spaces, Arabic ي/ك, digit sets, punctuation, and the formatting Word keeps in complex-script slots (font, size, bold), margins, captions, page numbers. Offline, with a safe --fix written to a copy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammadreza Zare", email = "mrzroot@users.noreply.github.com" }]
keywords = ["persian", "farsi", "docx", "thesis", "zwnj", "half-space", "linter", "word", "virastar", "iran"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Natural Language :: Persian",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "python-docx>=1.0"]

[project.urls]
Homepage = "https://mrzroot.github.io/payanlint/"
Source = "https://github.com/mrzroot/payanlint"
Issues = "https://github.com/mrzroot/payanlint/issues"

[project.scripts]
payanlint = "payanlint.cli:main"

[tool.setuptools.dynamic]
version = { attr = "payanlint.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
